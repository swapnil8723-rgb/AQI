# The hourly ingest, for the Cloudflare Workers Free plan.
#
# Free Workers get 10 ms of CPU per request and 5 cron triggers per account —
# too little to score ~280 cities and parse a 14-page PDF every hour. So the
# work runs here and the results are stored through the Worker's /store
# gateway (workers/ingest/src/store.ts).
#
# Each run: the hourly estimate; from 17:00 to 21:00 IST also the 4 PM
# bulletin; just after midnight IST also yesterday's archive; every ~6 hours
# the world estimate (packages/pipeline/src/global.ts). Once a day the
# model is recalibrated against recent bulletins. GitHub emails you if a run fails.
#
# The hourly estimate comes from CAMS and needs no API key — CPCB's own feed
# went down in Sep 2026 (packages/pipeline/src/cams.ts). The official daily
# figure is still CPCB's bulletin PDF, which is unaffected.
#
# Setup (repo → Settings → Secrets and variables → Actions):
#   secrets:   INGEST_TOKEN (same value as the Worker's secret)
#   variables: INGEST_URL = https://aqi.<you>.workers.dev
#
# On Workers Paid: restore the crons in workers/ingest/wrangler.jsonc and disable this workflow.
name: ingest

on:
  schedule:
    - cron: '20 * * * *'
    # 22:15 IST, after the bulletin has been stored: relearn the correction.
    - cron: '45 16 * * *'
  workflow_dispatch:
    inputs:
      job:
        description: 'auto | hourly | bulletin | archive | global | calibrate'
        default: 'auto'
      date:
        description: 'YYYY-MM-DD (bulletin / archive; blank = today / yesterday)'
        default: ''

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Ingest
        if: inputs.job != 'calibrate'
        run: node scripts/ingest-run.ts "${{ inputs.job || 'auto' }}" "${{ inputs.date }}"
        env:
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          INGEST_URL: ${{ vars.INGEST_URL }}
      # The model runs hot over India; this relearns each city's correction
      # from the bulletins already stored (packages/pipeline/src/cams.ts).
      - name: Recalibrate against recent bulletins
        if: github.event.schedule == '45 16 * * *' || inputs.job == 'calibrate'
        run: node scripts/calibrate.ts
        env:
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          INGEST_URL: ${{ vars.INGEST_URL }}
